<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <h1>TaxAccount</h1>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="email?.invalid && email?.touched"/>
        @if (email?.invalid && email?.touched) {
          <span class="error-text">Please enter a valid email</span>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="password?.invalid && password?.touched"/>
        @if (password?.invalid && password?.touched) {
          <span class="error-text">Password must be at least 8 characters</span>
        }
      </div>

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/auth/register">Register</a></p>
    </div>

  </div>
</div>
