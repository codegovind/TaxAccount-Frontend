<aside class="sidebar" [class.collapsed]="isCollapsed()" [class.mobile-open]="isOpen">
  <div class="sidebar-header">
    <div class="brand">
      <span class="brand-text">{{ companyName() }}</span>
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <span class="icon">☰</span>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (item of menuItems; track item.path) {
      @if (item.children) {
        <!-- Parent item with dropdown -->
        <div class="nav-group">
          <a [routerLink]="item.path" routerLinkActive="active" class="nav-item has-children" (click)="onItemClick()">
            <span class="icon">{{ item.icon }}</span>
            <span class="nav-text">{{ item.title }}</span>
            <span class="arrow">▼</span>
          </a>
          <div class="submenu">
            @for (child of item.children; track child.path) {
              <a [routerLink]="child.path" routerLinkActive="active" class="nav-item child-item" (click)="onItemClick()">
                <span class="nav-text">{{ child.title }}</span>
              </a>
            }
          </div>
        </div>
      } @else {
        <!-- Regular item without children -->
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="onItemClick()">
          <span class="icon">{{ item.icon }}</span>
          <span class="nav-text">{{ item.title }}</span>
        </a>
      }
    }
  </nav>

  <!-- Updated to modern @if syntax -->
  <div class="sidebar-footer">
    <button class="nav-item logout-btn" (click)="onLogout()">
      <span class="icon">🚪</span>
      <span class="nav-text">Logout</span>
    </button>
  </div>
</aside>
