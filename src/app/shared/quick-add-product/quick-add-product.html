<div class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Quick Add Product</h3>
      <button class="close-btn" (click)="cancelled.emit()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" formControlName="name"
          placeholder="Product name"/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>HSN Code</label>
          <input type="text" formControlName="hsnCode"
            placeholder="HSN code"/>
        </div>
        <div class="form-group">
          <label>Unit</label>
          <select formControlName="unit">
            @for (unit of units; track unit) {
              <option [value]="unit">{{ unit }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Purchase Price (₹) *</label>
          <input type="number" formControlName="purchasePrice"
            min="0" step="0.01"/>
        </div>
        <div class="form-group">
          <label>Selling Price (₹) *</label>
          <input type="number" formControlName="price"
            min="0" step="0.01"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>GST Rate</label>
          <select formControlName="gstPercent">
            @for (rate of gstRates; track rate) {
              <option [value]="rate">{{ rate }}%</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label>Opening Stock</label>
          <input type="number" formControlName="stock"
            min="0" step="0.01"/>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn-secondary"
          (click)="cancelled.emit()">
          Cancel
        </button>
        <button type="submit" class="btn-primary"
          [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : 'Add Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
