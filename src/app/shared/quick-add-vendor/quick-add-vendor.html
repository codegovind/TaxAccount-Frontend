<div class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Quick Add Vendor</h3>
      <button class="close-btn" (click)="cancelled.emit()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Vendor Name *</label>
        <input type="text" formControlName="name"
          placeholder="Company or person name"/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>GST Type</label>
          <select formControlName="gstType">
            <option [value]="1">Registered</option>
            <option [value]="2">Unregistered</option>
            <option [value]="3">Composition</option>
          </select>
        </div>
        <div class="form-group">
          <label>State</label>
          <select formControlName="state">
            <option value="">Select state</option>
            @for (state of indianStates; track state) {
              <option [value]="state">{{ state }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>GSTIN</label>
        <input type="text" formControlName="gstin"
          placeholder="15 digit GSTIN" maxlength="15"/>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" formControlName="phone"
          placeholder="Mobile number"/>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }

      <div class="modal-actions">
        <button type="button" class="btn-secondary"
          (click)="cancelled.emit()">
          Cancel
        </button>
        <button type="submit" class="btn-primary"
          [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Saving...' : 'Add Vendor' }}
        </button>
      </div>
    </form>
  </div>
</div>
