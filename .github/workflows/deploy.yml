name: TaxAccount Frontend - Build and Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout code
        uses: actions/checkout@v4

      - name: Step 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Step 3 - Install dependencies
        run: npm install

      - name: Step 4 - Build Angular
        run: npm run build -- --configuration=production

      - name: Step 4.5 - Debug Path
        run: ls -R dist/

      - name: Step 5 - Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Step 6 - Deploy to S3
        run: |
          aws s3 sync dist/taxaccount-frontend/browser/ \
            s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Step 7 - Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
          echo "Frontend deployed successfully!"